const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
// Cap pixel ratio at 1.5 for performance
const PR = Math.min(window.devicePixelRatio||1, 1.5);
let W, H;
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W * PR);
  canvas.height = Math.round(H * PR);
  canvas.style.width  = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(PR,0,0,PR,0,0);
}
resize();
window.addEventListener('resize', resize);

// Pan/zoom
let panX=0, panY=0, zoom=1;
const ZOOM_MIN=0.25, ZOOM_MAX=20000;
function toScreen(wx,wy){ return {x:W/2+(wx+panX)*zoom, y:H/2+(wy+panY)*zoom}; }
function toWorld(sx,sy){  return {x:(sx-W/2)/zoom-panX,  y:(sy-H/2)/zoom-panY}; }
function zoomAt(sx,sy,f){
  const b=toWorld(sx,sy);
  zoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,zoom*f));
  const a=toWorld(sx,sy);
  panX+=a.x-b.x; panY+=a.y-b.y;
}

// Colour utils
function lerpColor(h,amt){
  try{
    const r=parseInt(h.slice(1,3),16)||0,g=parseInt(h.slice(3,5),16)||0,b=parseInt(h.slice(5,7),16)||0;
    return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
  }catch(e){return h;}
}

// ── Draw functions ────────────────────────────────────────────────
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b;}
function noGlow(){ctx.shadowBlur=0;}

function radGrad(x,y,r,fill){
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.05,x,y,r);
  g.addColorStop(0,lerpColor(fill,40));g.addColorStop(1,fill);
  return g;
}

// shape drawers (all in SCREEN coords, already transformed)
function drawCircle(x,y,r,fill,stroke,a){
  if(r<1)return;
  ctx.save();ctx.globalAlpha=a;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  if(fill!=='transparent'){ctx.fillStyle=radGrad(x,y,r,fill);ctx.fill();}
  ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,r*0.045);
  glow(stroke,r*0.55);ctx.stroke();noGlow();
  ctx.restore();
}

function drawEllipse2(x,y,rx,ry,angle,fill,stroke,a){
  if(rx<1)return;
  ctx.save();ctx.globalAlpha=a;
  ctx.translate(x,y);ctx.rotate(angle||0);
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  if(fill!=='transparent'){ctx.fillStyle=radGrad(0,0,rx,fill);ctx.fill();}
  ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,rx*0.045);
  glow(stroke,rx*0.5);ctx.stroke();noGlow();
  ctx.restore();
}

function drawBlob2(x,y,rx,ry,fill,stroke,a){
  if(rx<1)return;
  ctx.save();ctx.globalAlpha=a;
  const n=60;
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const ang=(i/n)*Math.PI*2;
    const w=1+0.04*Math.sin(ang*3+T*0.4)+0.025*Math.sin(ang*7-T*0.25);
    const px2=x+Math.cos(ang)*rx*w,py2=y+Math.sin(ang)*ry*w;
    i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
  }
  ctx.closePath();
  if(fill!=='transparent'){ctx.fillStyle=radGrad(x,y,rx,fill);ctx.fill();}
  ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,rx*0.03);
  glow(stroke,rx*0.4);ctx.stroke();noGlow();
  ctx.restore();
}

function drawRing2(x,y,rx,ry,thick,stroke,a,angle){
  if(rx<2)return;
  ctx.save();ctx.globalAlpha=a;
  ctx.translate(x,y);ctx.rotate(angle||0);
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  ctx.strokeStyle=stroke;ctx.lineWidth=thick||Math.max(2,rx*0.07);
  glow(stroke,rx*0.4);ctx.stroke();noGlow();
  ctx.restore();
}

function drawStack2(x,y,rx,ry,layers,fill,stroke,a,angle){
  if(rx<2)return;
  const n=layers||5;
  ctx.save();ctx.globalAlpha=a;
  ctx.translate(x,y);ctx.rotate(angle||0);
  const sp=ry*2.5;
  for(let i=0;i<n;i++){
    const oy=(i-(n-1)/2)*sp;
    const wave=Math.sin(T*0.5+i)*ry*0.25;
    ctx.beginPath();ctx.ellipse(wave,oy,rx,ry,0,0,Math.PI*2);
    const g2=ctx.createRadialGradient(-rx*0.3,oy-ry*0.3,rx*0.05,0,oy,rx);
    g2.addColorStop(0,lerpColor(fill,40));g2.addColorStop(1,fill);
    ctx.fillStyle=g2;ctx.fill();
    ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,ry*0.6);
    glow(stroke,ry*2);ctx.stroke();noGlow();
  }
  ctx.restore();
}

function drawCrescent2(x,y,rx,ry,fill,stroke,a,angle){
  if(rx<2)return;
  ctx.save();ctx.globalAlpha=a;
  ctx.translate(x,y);ctx.rotate(angle||0);
  const rows=4;
  for(let i=0;i<rows;i++){
    const t2=i/(rows-1);
    const cy2=(t2-0.5)*ry*3.2;
    const rxl=rx*(0.55+0.45*(1-Math.abs(t2-0.5)*2));
    ctx.beginPath();ctx.ellipse(0,cy2,rxl,ry*0.55,0,0,Math.PI*2);
    const g3=ctx.createRadialGradient(0,cy2,rxl*0.1,0,cy2,rxl);
    g3.addColorStop(0,lerpColor(fill,30));g3.addColorStop(1,fill);
    ctx.fillStyle=g3;ctx.fill();
    ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,ry*0.4);
    glow(stroke,ry*1.5);ctx.stroke();noGlow();
  }
  ctx.restore();
}

function drawPolygon2(x,y,r,sides,fill,stroke,a,angle){
  if(r<1)return;
  ctx.save();ctx.globalAlpha=a;
  ctx.translate(x,y);ctx.rotate((angle||0)+T*0.35);
  ctx.beginPath();
  for(let i=0;i<sides;i++){
    const ang=(i/sides)*Math.PI*2-Math.PI/2;
    i===0?ctx.moveTo(Math.cos(ang)*r,Math.sin(ang)*r):ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);
  }
  ctx.closePath();
  const g4=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.05,0,0,r);
  g4.addColorStop(0,lerpColor(fill,40));g4.addColorStop(1,fill);
  ctx.fillStyle=g4;ctx.fill();
  ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,r*0.12);
  glow(stroke,r*0.55);ctx.stroke();noGlow();
  ctx.restore();
}

function drawDNA(x,y,r,fill,stroke,a){
  // Double-helix representation
  if(r<4)return;
  ctx.save();ctx.globalAlpha=a;
  const h=r*1.8,steps=40;
  // strand 1
  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    const t2=i/steps;
    const px2=x+Math.sin(t2*Math.PI*4+T*0.6)*r*0.7;
    const py2=y-h/2+t2*h;
    i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
  }
  ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1.5,r*0.1);
  glow(stroke,r*0.4);ctx.stroke();noGlow();
  // strand 2
  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    const t2=i/steps;
    const px2=x+Math.sin(t2*Math.PI*4+T*0.6+Math.PI)*r*0.7;
    const py2=y-h/2+t2*h;
    i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
  }
  ctx.strokeStyle=lerpColor(fill,80);ctx.lineWidth=Math.max(1.5,r*0.1);
  glow(lerpColor(fill,80),r*0.4);ctx.stroke();noGlow();
  // rungs
  ctx.strokeStyle=lerpColor(fill,50);ctx.lineWidth=Math.max(1,r*0.06);
  for(let i=0;i<10;i++){
    const t2=i/9;
    const x1=x+Math.sin(t2*Math.PI*4+T*0.6)*r*0.7;
    const x2=x+Math.sin(t2*Math.PI*4+T*0.6+Math.PI)*r*0.7;
    const py2=y-h/2+t2*h;
    ctx.beginPath();ctx.moveTo(x1,py2);ctx.lineTo(x2,py2);ctx.stroke();
  }
  ctx.restore();
}

function drawLabel2(x,y,r,name,a){
  const fade=Math.min(1,(r-12)/22)*a;
  if(fade<0.06)return;
  const fs=Math.min(13,Math.max(8,r*0.2));
  ctx.save();ctx.globalAlpha=fade;
  ctx.font=`${fs}px 'Courier New'`;
  ctx.fillStyle='#c0ffd8';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#00ff88';ctx.shadowBlur=4;
  ctx.fillText(name.split('(')[0].split('/')[0].trim(),x,y);
  ctx.restore();
}

// ── Render a node in screen space ────────────────────────────────
function renderNode(node, wx, wy, parentAlpha){
  const s=toScreen(wx,wy);
  const sx=s.x, sy=s.y;
  const sr=node.rx*zoom;
  const sFadeIn=4, sFull=16;
  const a=parentAlpha*Math.min(1,(sr-sFadeIn)/(sFull-sFadeIn));
  if(a<=0||sr<1.5)return;

  const f=node.fill||'#111', st=node.stroke||'#fff';
  const sry=(node.ry||node.rx)*zoom;
  const ang=node.angle||0;

  switch(node.shape){
    case 'blob':    drawBlob2(sx,sy,sr,sry,f,st,a); break;
    case 'circle':  drawCircle(sx,sy,sr,f,st,a); break;
    case 'ellipse': drawEllipse2(sx,sy,sr,sry,ang,f,st,a); break;
    case 'ring':    drawRing2(sx,sy,sr,sry,node.thick?node.thick*zoom:null,st,a,ang); break;
    case 'stack':   drawStack2(sx,sy,sr,sry,node.layers,f,st,a,ang); break;
    case 'crescent':drawCrescent2(sx,sy,sr,sry,f,st,a,ang); break;
    case 'polygon': drawPolygon2(sx,sy,sr,node.sides||6,f,st,a,ang); break;
    case 'dna':     drawDNA(sx,sy,sr,f,st,a); break;
  }
  drawLabel2(sx,sy,sr,node.name,a);

  const childThr=(node.childShow!==undefined?node.childShow:80)*zoom/zoom; // world thresh × zoom
  // use childShow as screen-radius threshold
  const csThresh=node.childShow!==undefined?node.childShow:80;
  if(sr>csThresh && node.children && node.children.length){
    const cf=Math.min(1,(sr-csThresh)/50);
    node.children.forEach(c=>renderNode(c,wx+c.x,wy+c.y,a*cf));
  }
}

// ── Starfield ─────────────────────────────────────────────────────
const STARS=Array.from({length:150},()=>({
  wx:(Math.random()-0.5)*3000,wy:(Math.random()-0.5)*3000,
  r:Math.random()*1.1+0.3,a:Math.random()*0.45+0.15
}));
function drawStars(){
  const v=Math.max(0,1-(zoom-0.4)*2.8);if(v<0.01)return;
  ctx.save();ctx.globalAlpha=v;
  STARS.forEach(s=>{
    const p=toScreen(s.wx,s.wy);
    ctx.beginPath();ctx.arc(p.x,p.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(140,255,185,${s.a})`;ctx.fill();
  });
  ctx.restore();
}

// ── Depth label ───────────────────────────────────────────────────
const lblEl=document.getElementById('lbl');
function updateLabel(){
  const w=toWorld(W/2,H/2);
  let best=DATA, bestR=DATA.rx;
  function chk(n,ox,oy){
    if(!n||n.shape==='ring')return;
    const d=Math.hypot((w.x-ox)/n.rx,(w.y-oy)/(n.ry||n.rx));
    if(d<1.05&&n.rx<bestR){best=n;bestR=n.rx;}
    if(n.children)n.children.forEach(c=>chk(c,ox+c.x,oy+c.y));
  }
  chk(DATA,0,0);
  lblEl.textContent=best.name.split('(')[0].toUpperCase().trim();
}

// ── Main loop ─────────────────────────────────────────────────────
let lastFrame=0;
function frame(ts){
  T=ts*0.001;
  ctx.clearRect(0,0,W,H);
  // Background
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  bg.addColorStop(0,'#010b06');bg.addColorStop(1,'#000000');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  drawStars();
  renderNode(DATA,0,0,1);
  updateLabel();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── Info popup ────────────────────────────────────────────────────
const panel=document.getElementById('info');
const iname=document.getElementById('iname');
const idesc=document.getElementById('idesc');
let infoTimer;
function showInfo(n){
  if(!n)return;
  iname.textContent=n.name;
  idesc.textContent=n.desc||'';
  panel.classList.add('on');
  clearTimeout(infoTimer);
  infoTimer=setTimeout(()=>panel.classList.remove('on'),6000);
}

// Hit test: smallest node containing world point
function hitTest(sx,sy){
  const w=toWorld(sx,sy);
  let best=null,bestR=Infinity;
  function chk(n,ox,oy){
    const d=Math.hypot((w.x-ox)/(n.rx||1),(w.y-oy)/((n.ry||n.rx)||1));
    const inside=n.shape==='ring'?(d>0.8&&d<1.2):(d<1.1);
    if(inside&&n.rx<bestR){best=n;bestR=n.rx;}
    if(n.children)n.children.forEach(c=>chk(c,ox+c.x,oy+c.y));
  }
  chk(DATA,0,0);
  return best;
}

// ── Mouse ─────────────────────────────────────────────────────────
let drag=false,lm={x:0,y:0},moved=false;
canvas.addEventListener('mousedown',e=>{drag=true;lm={x:e.clientX,y:e.clientY};moved=false;});
canvas.addEventListener('mousemove',e=>{
  if(!drag)return;
  if(Math.hypot(e.clientX-lm.x,e.clientY-lm.y)>3)moved=true;
  panX+=(e.clientX-lm.x)/zoom;panY+=(e.clientY-lm.y)/zoom;
  lm={x:e.clientX,y:e.clientY};
});
window.addEventListener('mouseup',e=>{
  if(!moved){const n=hitTest(e.clientX,e.clientY);if(n)showInfo(n);}
  drag=false;
});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.13:1/1.13);},{passive:false});

// ── Touch ─────────────────────────────────────────────────────────
let pinching=false,lastDist=0,lastCX=0,lastCY=0;
let tStart={x:0,y:0},tMoved=false;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();tMoved=false;
  if(e.touches.length===1){
    const t=e.touches[0];tStart={x:t.clientX,y:t.clientY};
    lm={x:t.clientX,y:t.clientY};drag=true;pinching=false;
  }else if(e.touches.length>=2){
    drag=false;pinching=true;
    lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    lastCX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    lastCY=(e.touches[0].clientY+e.touches[1].clientY)/2;
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();tMoved=true;
  if(e.touches.length===1&&drag){
    const t=e.touches[0];
    panX+=(t.clientX-lm.x)/zoom;panY+=(t.clientY-lm.y)/zoom;
    lm={x:t.clientX,y:t.clientY};
  }else if(e.touches.length>=2&&pinching){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const cx2=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const cy2=(e.touches[0].clientY+e.touches[1].clientY)/2;
    zoomAt(cx2,cy2,d/lastDist);
    panX+=(cx2-lastCX)/zoom;panY+=(cy2-lastCY)/zoom;
    lastDist=d;lastCX=cx2;lastCY=cy2;
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(!tMoved&&e.changedTouches.length===1){
    const t=e.changedTouches[0];
    if(Math.hypot(t.clientX-tStart.x,t.clientY-tStart.y)<10){
      showInfo(hitTest(t.clientX,t.clientY));
    }
  }
  drag=false;pinching=false;
},{passive:false});
</script>
